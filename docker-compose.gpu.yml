# GPU is no longer a compose override.
#
# OCR and the embedder are not part of this stack any more: Switch-Service owns
# their containers in the shared podman network models_network
# (Switch-Service/docs/models-network.md). The image is built once with the
# `cuda` target; whether llama.cpp puts layers on the GPU is decided per service
# by OCR_LLAMA_NGL / EMBEDDING_LLAMA_NGL in the Switch-Service catalog, and the
# CDI device (nvidia.com/gpu=all) is passed by Switch-Service, not by a compose
# `devices:` stanza.
#
# This file is kept as an empty overlay so an old
# `-f docker-compose.gpu.yml` invocation parses and changes nothing.
services: {}
