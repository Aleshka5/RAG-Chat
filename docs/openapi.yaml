openapi: 3.0.3
info:
  title: RAG Chat Public API
  version: 1.0.0
  description: |
    Публичный контракт File Collector (`/api/files`) и Chat (`/api/chats`).
    Поведение, не выражаемое схемой, описано в `docs/api.md`.
    Пользователя задаёт Auth Gateway заголовком `X-Auth-User-Id`.
    `X-User-Id` личность не задаёт. `X-Auth-Role: BLOCKED` — 403.
servers:
  - url: /
    description: За существующим gateway
tags:
  - name: Files
  - name: Chats
  - name: Health
paths:
  /health:
    get:
      tags: [Health]
      summary: Процесс жив
      security: []
      responses:
        "200":
          description: Процесс отвечает. Зависимости не проверяются.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/files:
    get:
      tags: [Files]
      summary: Список файлов пользователя
      parameters:
        - $ref: "#/components/parameters/Limit50"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Файлы без статуса deleted, новые сначала.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Files]
      summary: Загрузить PDF
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Файл сохранён и поставлен в обработку.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Такой файл уже есть у пользователя.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: duplicate_file
                  message: A file with the same content already exists
                  details:
                    file_id: 6f1c0c3e-3c8a-4f0e-9a4a-1d2b3c4d5e6f
        "413":
          $ref: "#/components/responses/FileTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "500":
          description: Файл записан, но публикация в очередь не удалась.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/files/documents:
    post:
      tags: [Files]
      summary: Зарегистрировать уже лежащий в бакете PDF
      description: |
        Манифест объекта в `S3_BUCKET`. Тело файла не передаётся, байты не копируются,
        SHA-256 не пересчитывается. `content_type` обязан быть `application/pdf`.
        Word, `text/plain` и любой другой тип — `415`, не `400`.
        Успех публикует `doc.process` и возвращает карточку файла.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRegistration"
      responses:
        "202":
          description: Документ поставлен в прежний PDF-конвейер.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ObjectNotFound"
        "409":
          description: Активный файл пользователя с тем же хешем или тем же s3_key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: duplicate_file
                  message: A file with the same content already exists
                  details:
                    file_id: 6f1c0c3e-3c8a-4f0e-9a4a-1d2b3c4d5e6f
        "415":
          description: content_type не application/pdf. Word и text/plain входят в этот ответ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: unsupported_media_type
                  message: Only PDF is accepted
        "500":
          description: Метаданные записаны, публикация в очередь не удалась.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/files/images:
    post:
      tags: [Files]
      summary: Зарегистрировать уже лежащее в бакете изображение
      description: |
        Тот же манифест, что у документа. `content_type` — один из
        `image/jpeg`, `image/png`, `image/webp`, `image/gif`.
        Иной тип — `415`. У карточки `page_count` равен null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageRegistration"
      responses:
        "202":
          description: Изображение поставлено в конвейер коллекции images.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ObjectNotFound"
        "409":
          description: Активный файл пользователя с тем же хешем или тем же s3_key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: content_type не из четырёх типов изображения.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: unsupported_media_type
                  message: Only JPEG, PNG, WebP and GIF images are accepted
        "500":
          description: Метаданные записаны, публикация в очередь не удалась.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/files/{file_id}:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      summary: Карточка файла
      responses:
        "200":
          description: Метаданные файла.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FileNotFound"
    delete:
      tags: [Files]
      summary: Поставить файл на удаление
      responses:
        "202":
          description: Удаление поставлено в очередь.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "409":
          description: Файл ещё обрабатывается или удаление уже идёт.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: file_busy
                  message: File cannot be deleted in its current state
        "500":
          description: Статус deleting записан, публикация не подтвердилась.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/files/{file_id}/content:
    parameters:
      - $ref: "#/components/parameters/FileId"
    get:
      tags: [Files]
      summary: Байты файла
      responses:
        "200":
          description: |
            Содержимое файла. Content-Type — сохранённый content_type.
            Для PDF страницу выбирает клиент. Для изображения отдаются байты кадра.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: inline, с filename и filename*
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/FileNotFound"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /api/chats:
    get:
      tags: [Chats]
      summary: Список чатов
      parameters:
        - $ref: "#/components/parameters/Limit50"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Чаты пользователя, недавно обновлённые сначала.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Chats]
      summary: Создать чат
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChat"
      responses:
        "201":
          description: Пустой чат создан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chat"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/chats/image-search:
    get:
      tags: [Chats]
      summary: Найти изображения по текстовому запросу
      description: |
        Статический путь префикса `/api/chats`. `image-search` не является chat_id.
        Вектор считается `POST /embed` с `input_type=query` и ищет коллекцию `images`.
        В выдаче только файлы этого пользователя со статусом `ready`, по убыванию score.
      parameters:
        - $ref: "#/components/parameters/ImageQuery"
        - $ref: "#/components/parameters/ImageSearchLimit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Страница попаданий. next_offset равен null, если страница короче limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageSearchPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: Embedding отверг запрос.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
        "504":
          description: Таймаут Embedding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/chats/{chat_id}:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    get:
      tags: [Chats]
      summary: Чат с сообщениями
      parameters:
        - $ref: "#/components/parameters/Limit200"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Сообщения по возрастанию времени.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
    delete:
      tags: [Chats]
      summary: Удалить чат и сообщения
      responses:
        "204":
          description: Чат удалён.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
  /api/chats/{chat_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ChatId"
    post:
      tags: [Chats]
      summary: Задать вопрос и получить поток ответа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessage"
      responses:
        "200":
          description: |
            Поток SSE. События разделены пустой строкой.
            Порядок: `meta`, ноль или больше `delta`, затем ровно одно из `done` или `error`.
            `finish_reason` в `done` — `stop` либо `retrieval_only`.
            `retrieval_only` значит, что источники есть, текстовых `delta` нет и провайдер LLM был недоступен до первого токена.

            ```
            event: meta
            data: {"chat_id":"...","user_message_id":"...","assistant_message_id":"...","sources":[]}

            event: delta
            data: {"content":"текст"}

            event: done
            data: {"finish_reason":"stop"}
            ```

            ```
            event: meta
            data: {"chat_id":"...","user_message_id":"...","assistant_message_id":"...","sources":[]}

            event: done
            data: {"finish_reason":"retrieval_only"}
            ```

            `sources` в `meta` совпадает с тем, что будет сохранено у ответа.
            Ошибка до начала потока возвращается JSON-телом и кодом 4xx/5xx, а не событием.

            Режим `images` LLM не вызывает. В `meta` есть `images` и `sources: []`.
            Одна `delta` содержит `Найдено изображений: N.` либо `Не найдено изображений.`
            `done` несёт `finish_reason` `stop`.

            ```
            event: meta
            data: {"chat_id":"...","user_message_id":"...","assistant_message_id":"...","sources":[],"images":[]}

            event: delta
            data: {"content":"Найдено изображений: 1."}

            event: done
            data: {"finish_reason":"stop"}
            ```
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/ChatNotFound"
        "502":
          description: Embedding или LLM отвергли запрос до начала потока.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
        "504":
          description: Таймаут LLM до начала потока.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    AuthUserId:
      type: apiKey
      in: header
      name: X-Auth-User-Id
      description: |
        UUID из JWT `sub`, который подставил Auth Gateway.
        Клиент этот заголовок не передаёт.
  parameters:
    FileId:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChatId:
      name: chat_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit50:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Limit200:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    ImageQuery:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 4000
      description: После обрезки краёв от 1 до 4000 символов.
    ImageSearchLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
  responses:
    Unauthorized:
      description: Нет X-Auth-User-Id или это не UUID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthenticated
              message: Missing or invalid X-Auth-User-Id
    Forbidden:
      description: X-Auth-Role равен BLOCKED.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: forbidden
              message: User is blocked
    ValidationError:
      description: Тело или query не прошли проверку.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_error
              message: Invalid request
              details:
                fields: [content]
    ObjectNotFound:
      description: |
        Объекта нет в бакете, либо ключ имеет вид files/{uuid}/... и этот UUID
        не равен вызывающему.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: object_not_found
              message: Object not found
    FileNotFound:
      description: Файл не найден, удалён или принадлежит другому пользователю.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: file_not_found
              message: File not found
    ChatNotFound:
      description: Чат не найден или принадлежит другому пользователю.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: chat_not_found
              message: Chat not found
    FileTooLarge:
      description: Размер больше MAX_UPLOAD_BYTES (по умолчанию 500 МиБ, 524288000 байт).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: file_too_large
              message: File exceeds the size limit
    UnsupportedMedia:
      description: |
        Multipart принимает только сигнатуру PDF.
        Word и обычный текст дают этот же код.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unsupported_media_type
              message: Only PDF is accepted
    DependencyUnavailable:
      description: MongoDB, MinIO, Qdrant или Embedding недоступны.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: dependency_unavailable
              message: Dependency unavailable
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    File:
      type: object
      required:
        - file_id
        - file_name
        - file_size
        - status
        - page_count
        - content_type
        - error
        - progress
        - created_at
        - updated_at
      properties:
        file_id:
          type: string
          format: uuid
        file_name:
          type: string
        file_size:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [uploaded, processing, ready, error, deleting]
        page_count:
          type: integer
          minimum: 0
          nullable: true
          description: Число страниц PDF. У изображения и до открытия PDF равно null.
        content_type:
          type: string
          enum:
            - application/pdf
            - image/jpeg
            - image/png
            - image/webp
            - image/gif
          description: Есть у каждого файла, включая PDF.
        error:
          type: string
          nullable: true
          enum:
            - corrupt_pdf
            - storage_read_failed
            - embedding_failed
            - index_write_failed
            - metadata_update_failed
            - no_extractable_text
            - enqueue_failed
            - processing_attempts_exceeded
            - unsupported_image
        progress:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FileProgress"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FileProgress:
      type: object
      required: [pages_done, pages_total, chunks_done, chunks_total]
      properties:
        pages_done:
          type: integer
          minimum: 0
        pages_total:
          type: integer
          minimum: 0
          nullable: true
        chunks_done:
          type: integer
          minimum: 0
        chunks_total:
          type: integer
          minimum: 0
          nullable: true
    FileList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/File"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          minimum: 0
    DeleteAccepted:
      type: object
      required: [file_id, status]
      properties:
        file_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [deleting]
    CreateChat:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
    Chat:
      type: object
      required: [chat_id, title, created_at, updated_at]
      properties:
        chat_id:
          type: string
          format: uuid
        title:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChatList:
      type: object
      required: [items, limit, offset, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Chat"
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
          minimum: 0
    Source:
      type: object
      required: [file_id, file_name, page_number, chunk_index, snippet, score]
      properties:
        file_id:
          type: string
          format: uuid
        file_name:
          type: string
        page_number:
          type: integer
          minimum: 1
        chunk_index:
          type: integer
          minimum: 0
        snippet:
          type: string
          maxLength: 500
        score:
          type: number
    Message:
      type: object
      required: [message_id, role, content, created_at]
      properties:
        message_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
          description: У режима images массив пуст. У сообщения user поля нет.
        images:
          type: array
          items:
            $ref: "#/components/schemas/ChatImage"
          description: Только у ответа режима images, включая пустой массив. У режима documents поля нет.
        finish_reason:
          type: string
          enum: [retrieval_only]
          description: Только у ответа ассистента без текста LLM. У обычного ответа поле отсутствует.
        created_at:
          type: string
          format: date-time
    ChatDetails:
      allOf:
        - $ref: "#/components/schemas/Chat"
        - type: object
          required: [messages, limit, offset, total_messages]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
            limit:
              type: integer
            offset:
              type: integer
            total_messages:
              type: integer
              minimum: 0
    CreateMessage:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 4000
        mode:
          type: string
          enum: [documents, images]
          description: Нет поля — режим documents. Иное значение — 400 validation_error, поле mode.
    RegisteredObject:
      type: object
      required: [s3_key, file_name, content_sha256, file_size, content_type]
      properties:
        s3_key:
          type: string
          minLength: 1
          description: Ключ в S3_BUCKET. Без ведущего слэша, без `..` и без обратной косой.
        file_name:
          type: string
          minLength: 1
          maxLength: 255
        content_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        file_size:
          type: integer
          minimum: 1
        content_type:
          type: string
    DocumentRegistration:
      allOf:
        - $ref: "#/components/schemas/RegisteredObject"
      description: content_type равен application/pdf. Иной тип — ответ 415, не ошибка схемы.
    ImageRegistration:
      allOf:
        - $ref: "#/components/schemas/RegisteredObject"
      description: content_type — image/jpeg, image/png, image/webp или image/gif. Иной тип — 415.
    ImageHit:
      type: object
      required: [file_id, file_name, s3_key, s3_url, score, content_path]
      properties:
        file_id:
          type: string
          format: uuid
        file_name:
          type: string
        s3_key:
          type: string
        s3_url:
          type: string
          description: s3://{bucket}/{s3_key} без учётных данных.
        score:
          type: number
        content_path:
          type: string
          description: Путь /api/files/{file_id}/content.
    ImageSearchPage:
      type: object
      required: [items, limit, offset, next_offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImageHit"
        limit:
          type: integer
        offset:
          type: integer
        next_offset:
          type: integer
          minimum: 0
          nullable: true
    ChatImage:
      type: object
      required: [file_id, file_name, score, content_path]
      properties:
        file_id:
          type: string
          format: uuid
        file_name:
          type: string
        score:
          type: number
        content_path:
          type: string
security:
  - AuthUserId: []
