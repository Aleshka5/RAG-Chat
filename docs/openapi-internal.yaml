openapi: 3.0.3
info:
  title: RAG Chat Internal API
  version: 1.0.0
  description: |
    OCR и Embedding. Вызываются только из сети приложения.
    Поведение описано в `docs/internal-services.md`.
servers:
  - url: http://ocr:8090
    description: OCR
  - url: http://embedding:8091
    description: Embedding
tags:
  - name: OCR
  - name: Embedding
  - name: Health
paths:
  /health:
    get:
      tags: [Health]
      summary: Процесс жив и модель загружена
      responses:
        "200":
          description: Модель уже в памяти.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ocr:
    post:
      tags: [OCR]
      summary: Распознать одну страницу
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "200":
          description: Разбор завершён. Пустой text допустим.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "504":
          description: Бюджет OCR_TIMEOUT исчерпан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /embed:
    post:
      tags: [Embedding]
      summary: Посчитать векторы пачки текстов
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedRequest"
      responses:
        "200":
          description: Векторы в том же порядке, что и texts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "504":
          description: Бюджет EMBEDDING_TIMEOUT исчерпан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /embed/image:
    post:
      tags: [Embedding]
      summary: Посчитать векторы пачки изображений
      description: |
        Тот же процесс, что `POST /embed`. Изображения без префикса task.
        Ответ и размерность совпадают с `/embed`. Текстовые поля texts, input_type
        и title дают 400 validation_error.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedImageRequest"
      responses:
        "200":
          description: Векторы в том же порядке, что и images. L2-норма, 768 чисел.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedResult"
        "400":
          description: |
            validation_error. details.fields называет поле: images, model, texts,
            input_type, title или body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: validation_error
                  message: Invalid request
                  details:
                    fields: [images]
        "502":
          description: |
            upstream_failed. Контейнер опознан, но llama-server его не декодировал,
            llama-server ответил ошибкой, либо проектор изображения не загружен.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: upstream_failed
                  message: Upstream failed
        "504":
          description: Бюджет EMBEDDING_TIMEOUT исчерпан.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: upstream_timeout
                  message: Embedding timed out
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
  responses:
    ValidationError:
      description: Тело запроса отклонено. Текст длиннее EMBEDDING_MAX_TOKENS не обрезается.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: validation_error
              message: Invalid request
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    OcrResult:
      type: object
      required: [text, confidence, processing_time_ms]
      properties:
        text:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        processing_time_ms:
          type: integer
          minimum: 0
    EmbedRequest:
      type: object
      required: [texts, input_type]
      properties:
        texts:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
            minLength: 1
        input_type:
          type: string
          enum: [document, query]
          description: document получает префикс title/text, query — префикс question answering.
        title:
          type: string
          description: Имя файла. Обязательно для document и запрещено для query.
        model:
          type: string
          description: Если передано, обязано совпасть с EMBEDDING_MODEL.
    EmbedImageRequest:
      type: object
      additionalProperties: false
      required: [images]
      properties:
        images:
          type: array
          minItems: 1
          maxItems: 4
          description: |
            Base64. Верхняя длина — EMBEDDING_MAX_IMAGES, по умолчанию 4.
            После декодирования каждый элемент не больше EMBEDDING_MAX_IMAGE_BYTES
            (10485760). Контейнер — PNG, JPEG, WebP или GIF по сигнатуре байтов.
          items:
            type: string
            minLength: 1
        model:
          type: string
          description: Если передано, обязано совпасть с EMBEDDING_MODEL.
    EmbedResult:
      type: object
      required: [embeddings, model, dimension]
      properties:
        embeddings:
          type: array
          items:
            type: array
            minItems: 768
            maxItems: 768
            items:
              type: number
              format: float
        model:
          type: string
        dimension:
          type: integer
          example: 768
