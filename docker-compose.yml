# Local stand from docs/deployment.md.
# Build contexts are relative to the repository root, matching that example.
# Host ports are not published. OCR and embedding stay on rag_internal.
# The example AMQP URL uses host "rabbit"; the service name is rabbitmq, so
# the broker also answers to that alias.
# LLM_BASE_URL points at litellm-proxy-server on the pre-existing host
# network llm_network, so chat joins it as an external network.

networks:
  rag_internal:
    name: rag_internal
  rag_edge:
    name: rag_edge
  llm_network:
    name: llm_network
    external: true

services:
  rag-edge:
    build: ./services/rag-edge
    networks: [rag_internal, rag_edge]
    restart: unless-stopped
    depends_on: [file-collector, chat, frontend]
    environment:
      RAG_EDGE_PORT: "8080"
      MAX_UPLOAD_BYTES: "524288000"
      FILE_COLLECTOR_URL: http://file-collector:8081
      CHAT_URL: http://chat:8082
      FRONTEND_URL: http://frontend:3000

  file-collector:
    build: ./services/file-collector
    networks: [rag_internal]
    restart: unless-stopped
    depends_on: [mongo, minio, rabbitmq]
    environment:
      FILE_COLLECTOR_PORT: "8081"
      MAX_UPLOAD_BYTES: "524288000"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: documents
      MONGODB_URI: mongodb://mongo:27017/rag
      RABBITMQ_URL: amqp://rabbit:5672/

  processor:
    build: ./services/processor
    networks: [rag_internal]
    restart: unless-stopped
    depends_on: [mongo, minio, qdrant, ocr, embedding, rabbitmq]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MONGODB_URI: mongodb://mongo:27017/rag
      QDRANT_URL: http://qdrant:6333
      OCR_URL: http://ocr:8090
      OCR_TIMEOUT: ${OCR_TIMEOUT:-120}
      EMBEDDING_URL: http://embedding:8091
      RABBITMQ_URL: amqp://rabbit:5672/
      PROCESSOR_CONCURRENCY: "1"

  deletion-worker:
    build: ./services/deletion-worker
    networks: [rag_internal]
    restart: unless-stopped
    depends_on: [mongo, minio, qdrant, rabbitmq]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MONGODB_URI: mongodb://mongo:27017/rag
      QDRANT_URL: http://qdrant:6333
      RABBITMQ_URL: amqp://rabbit:5672/
      DELETION_CONCURRENCY: "1"

  chat:
    build: ./services/chat
    networks: [rag_internal, llm_network]
    restart: unless-stopped
    depends_on: [mongo, qdrant, embedding]
    environment:
      CHAT_PORT: "8082"
      MONGODB_URI: mongodb://mongo:27017/rag
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://embedding:8091
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}

  ocr:
    build:
      context: ./services/ocr
      target: cpu
    networks: [rag_internal]
    restart: unless-stopped
    volumes: ["ocr-model-cache:/var/cache/huggingface"]
    environment:
      OCR_TIMEOUT: ${OCR_TIMEOUT:-120}
      HF_TOKEN: ${HF_TOKEN:-}

  embedding:
    build: ./services/embedding
    networks: [rag_internal]
    restart: unless-stopped

  frontend:
    build: ./frontend
    networks: [rag_internal]
    restart: unless-stopped

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    networks: [rag_internal]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: ["minio-data:/data"]

  mongo:
    image: mongo:7
    networks: [rag_internal]
    restart: unless-stopped
    volumes: ["mongo-data:/data/db"]

  qdrant:
    image: qdrant/qdrant:v1.13.4
    networks: [rag_internal]
    restart: unless-stopped
    volumes: ["qdrant-data:/qdrant/storage"]

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    networks:
      rag_internal:
        aliases:
          - rabbit
    volumes: ["rabbit-data:/var/lib/rabbitmq"]

volumes:
  minio-data:
  mongo-data:
  qdrant-data:
  rabbit-data:
  ocr-model-cache:
