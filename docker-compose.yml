# Local stand from docs/deployment.md.
# Build contexts are relative to the repository root, matching that example.
# Host ports are not published. OCR, embedding, LLM and image generation are not part of this
# stack: they live in the shared podman network models_network and are owned by Switch-Service
# (Switch-Service/docs/models-network.md). processor and chat only join models_network as an
# external network, to reach http://ocr:8090 and http://embedding:8091 by name.
# MinIO and RabbitMQ live on the shared common_network (Common/docker-compose-common.yml):
#   - MinIO answers as `minio` (container_name), RabbitMQ as `rabbit` (alias).
#   - file-collector / processor / deletion-worker join common_network to reach them.
# Mongo and Qdrant stay local to this stack.
# LLM_BASE_URL points at litellm-proxy-server on the pre-existing host
# network llm_network, so chat joins it as an external network.

networks:
  rag_internal:
    name: rag_internal
  rag_edge:
    name: rag_edge
  common_network:
    name: common_network
    external: true
  # Models (ocr, embedding, llm, image) are created and owned by Switch-Service.
  # Embedding catalogue memory, recorded for that service and not applied here:
  # gpu 2304 MiB VRAM and 1024 MiB RAM; cpu 1792 MiB RAM.
  models_network:
    name: models_network
    external: true
  llm_network:
    name: llm_network
    external: true

services:
  rag-edge:
    build: ./services/rag-edge
    networks: [rag_internal, rag_edge]
    restart: unless-stopped
    depends_on: [file-collector, chat, frontend]
    environment:
      RAG_EDGE_PORT: "8080"
      MAX_UPLOAD_BYTES: "524288000"
      FILE_COLLECTOR_URL: http://file-collector:8081
      CHAT_URL: http://chat:8082
      FRONTEND_URL: http://frontend:3000

  file-collector:
    build:
      context: .
      dockerfile: services/file-collector/Dockerfile
    networks: [rag_internal, common_network]
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      FILE_COLLECTOR_PORT: "8081"
      MAX_UPLOAD_BYTES: "524288000"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: documents
      MONGODB_URI: mongodb://mongo:27017/rag
      RABBITMQ_URL: amqp://rabbit:5672/

  processor:
    build:
      context: .
      dockerfile: services/processor/Dockerfile
    networks: [rag_internal, common_network, models_network]
    restart: unless-stopped
    depends_on: [mongo, qdrant]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MONGODB_URI: mongodb://mongo:27017/rag
      QDRANT_URL: http://qdrant:6333
      OCR_URL: http://ocr:8090
      OCR_TIMEOUT: ${OCR_TIMEOUT:-120}
      EMBEDDING_URL: http://embedding:8091
      RABBITMQ_URL: amqp://rabbit:5672/
      PROCESSOR_CONCURRENCY: "1"

  deletion-worker:
    build:
      context: .
      dockerfile: services/deletion-worker/Dockerfile
    networks: [rag_internal, common_network]
    restart: unless-stopped
    depends_on: [mongo, qdrant]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MONGODB_URI: mongodb://mongo:27017/rag
      QDRANT_URL: http://qdrant:6333
      RABBITMQ_URL: amqp://rabbit:5672/
      DELETION_CONCURRENCY: "1"

  chat:
    build: ./services/chat
    networks: [rag_internal, llm_network, models_network]
    restart: unless-stopped
    depends_on: [mongo, qdrant]
    environment:
      CHAT_PORT: "8082"
      MONGODB_URI: mongodb://mongo:27017/rag
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_URL: http://embedding:8091
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}

  frontend:
    build: ./frontend
    networks: [rag_internal]
    restart: unless-stopped

  mongo:
    image: mongo:7
    networks: [rag_internal]
    restart: unless-stopped
    volumes: ["mongo-data:/data/db"]

  qdrant:
    image: qdrant/qdrant:v1.13.4
    networks: [rag_internal]
    restart: unless-stopped
    volumes: ["qdrant-data:/qdrant/storage"]

volumes:
  mongo-data:
  qdrant-data:
