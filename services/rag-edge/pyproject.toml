[project]
name = "rag-edge"
version = "1.0.0"
description = "Reverse proxy that routes the RAG host to file-collector, chat, and the frontend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "httpx>=0.28.1",
  "pydantic-settings>=2.6.1",
  "uvicorn>=0.34.0",
]

[project.scripts]
rag-edge = "rag_edge.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_edge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["rag_edge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
