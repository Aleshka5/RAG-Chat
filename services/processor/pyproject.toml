[project]
name = "processor"
version = "0.1.0"
description = "RAG document processor: PDF text, OCR, chunking, embeddings, Qdrant."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.27",
    "huggingface-hub>=0.26",
    "pika>=1.3",
    "pymongo>=4.10",
    "pymupdf>=1.24",
    "qdrant-client==1.13.3",
    "tokenizers>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/processor"]

[tool.hatch.build.targets.wheel.sources]
"src/processor" = "processor"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
