[project]
name = "deletion-worker"
version = "1.0.0"
description = "Consumer for doc.delete: MinIO, Qdrant, file_pages, then Mongo status deleted."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35.0",
  "pika>=1.3.2",
  "pymongo>=4.10.0",
  "qdrant-client==1.13.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deletion_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["deletion_worker", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["deletion_worker", "tests"]
