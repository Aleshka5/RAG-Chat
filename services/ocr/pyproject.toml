[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr"
version = "1.0.0"
description = "Internal OCR service: PaddleOCR PP-OCRv4 for English and Russian"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=1.4.10,<1.5",
    "fastapi>=0.115.6",
    "numpy>=1.26.4,<2",
    "opencv-contrib-python>=4.6,<4.11",
    "opencv-python>=4.6,<4.11",
    "paddleocr==2.10.0",
    "paddlepaddle==2.6.2",
    "pillow>=10.4.0",
    "python-multipart>=0.0.18",
    "scikit-image>=0.22,<0.25",
    "setuptools>=70",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
