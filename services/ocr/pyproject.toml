[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocr"
version = "1.0.0"
description = "Internal OCR service: Surya OCR 2 via llama.cpp"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115.6",
    "httpx>=0.28.0",
    "huggingface-hub>=0.26.0",
    "pillow>=10.4.0",
    "python-multipart>=0.0.18",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ocr_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
